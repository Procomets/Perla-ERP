<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perla Textiles Processor - ERP</title>
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
      /* Ensure up/down spinner buttons are completely eliminated */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none !important;
        margin: 0 !important;
        width: 0 !important;
        height: 0 !important;
        display: none !important;
        pointer-events: none !important;
      }
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none !important;
        margin: 0 !important;
        width: 0 !important;
        height: 0 !important;
        display: none !important;
        pointer-events: none !important;
      }
      input[type="number"] {
        -moz-appearance: textfield !important;
        -webkit-appearance: none !important;
        appearance: textfield !important;
      }
    </style>
    <script>
      (function() {
        function disableNumberArrows(e) {
          if (
            e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
            e.key === 'Up' || e.key === 'Down' ||
            e.keyCode === 38 || e.keyCode === 40 ||
            e.which === 38 || e.which === 40
          ) {
            var el = e.target || document.activeElement;
            if (el && (el.type === 'number' || (el.getAttribute && el.getAttribute('type') === 'number'))) {
              e.preventDefault();
              e.stopPropagation();
            }
          }
        }
        window.addEventListener('keydown', disableNumberArrows, true);
        document.addEventListener('keydown', disableNumberArrows, true);
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FA] text-slate-800 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
